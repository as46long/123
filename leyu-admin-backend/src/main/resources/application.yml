server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/leyu_music?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      table-prefix: t_
      id-type: auto

jwt:
  secret: leyu-music-secret-key-2024-very-long-secret-key
  expiration: 86400000

file:
  upload-path: ./uploads/
  access-url: http://localhost:8080/files/

wechat:
  appid: wxae47d797a849feb6
  secret: a5786cec5da916defbf46f0b03eeeeb5

knife4j:
  enable: true
  setting:
    language: zh-CN
